services:
  db:
    image: mariadb:10.11
    container_name: mini_forum_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-mini_forum}
      MARIADB_USER: ${DB_USER:-mini_forum_user}
      MARIADB_PASSWORD: ${DB_PASS:-minipass}
      TZ: Asia/Bangkok
    ports:
      - "${DB_PORT:-3307}:3306"   # ฝั่งเครื่องคุณ:3307 → ในคอนเทนเนอร์:3306
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: mini_forum_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-mini_forum_user}
      PMA_PASSWORD: ${DB_PASS:-minipass}
      UPLOAD_LIMIT: 256M
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:8080:80"       # เปิดเฉพาะเครื่องนี้ (ปลอดภัยกว่า)
    depends_on:
      - db

  api:
    image: node:20-alpine
    container_name: mini_forum_api
    working_dir: /app
    command: sh -c "npm ci || npm i && node src/app.js"
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mini_forum}
      DB_USER: ${DB_USER:-mini_forum_user}
      DB_PASS: ${DB_PASS:-minipass}
      JWT_SECRET: ${JWT_SECRET:-mini_secret}
      TZ: Asia/Bangkok
      NODE_ENV: production
      API_PORT: ${API_PORT:-3000}
    volumes:
      - ./api:/app
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: mini_forum_web
    depends_on:
      - api
    ports:
      - "80:80"                   # ให้เข้าผ่าน http://<IP-เครื่องคุณ> ได้
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
